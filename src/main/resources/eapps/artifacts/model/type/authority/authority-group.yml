---
id: authority-group
name:
  ru: Группа
  en: Group

dispNameTemplate:
  en: "${name.closest.en!_localId}"
  ru: "${name.closest.ru!_localId}"

formRef: uiserv/form@authority-group-form
parentRef: emodel/type@authority
journalRef: uiserv/journal@authority-groups

system: true
sourceId: emodel/authority-group

actions:
  - uiserv/action@edit-ext-users-info
  - uiserv/action@delete

model:
  attributes:
    - id: name
      name:
        ru: Имя
        en: Name
      type: MLTEXT
    - id: description
      name:
        ru: Описание
        en: Description
      type: MLTEXT
    - id: privateGroup
      name:
        ru: Приватная группа
        en: Private group
      type: BOOLEAN
    - id: branchType
    - id: branchSubType
    - id: roleType
    - id: roleSubType
    - id: roleIsManager
      type: BOOLEAN
  systemAttributes:
    - id: ldapDn
      name:
        ru: Исходный DN группы LDAP
        en: Original LDAP group DN
    - id: ldapPresent
      name:
        ru: Группа присутствует в LDAP
        en: Group present in LDAP
      type: BOOLEAN

aspects:
  - ref: emodel/aspect@import-data-config
    config:
      enabledDefaultVariant: false
      variants:
        - variantId: authority-group
          name:
            ru: Группы
            en: Groups
          camelDslRef: integrations/camel-dsl@authority-group-import-data
          allowedFor:
            - GROUP_ECOS_ADMINISTRATORS
    inheritConfig: false
