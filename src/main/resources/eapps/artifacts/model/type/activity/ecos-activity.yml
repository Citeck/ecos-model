---
id: ecos-activity
name:
  ru: Активность
  en: Activity

system: true
queryPermsPolicy: PUBLIC # visibility controlled in DAO

sourceId: emodel/activity
parentRef: emodel/type@user-base

dispNameTemplate:
  en: ${activityTitle.closest.en}
  ru: ${activityTitle.closest.ru}

defaultStatus: planned
inheritActions: false
actions:
  - uiserv/action@cancel-activity
defaultCreateVariant: true
model:
  statuses:
    - id: planned
      name:
        ru: Запланирована
        en: Planned
    - id: completed
      name:
        ru: Выполнена
        en: Completed
    - id: expired
      name:
        ru: Просрочена
        en: Expired
    - id: canceled
      name:
        ru: Отменена
        en: Canceled
  attributes:
    - id: topic
      name:
        ru: Тема
        en: Topic
    - id: text
      name:
        ru: Текст
        en: Text
    - id: activityTitle
      name:
        ru: Заголовок активности
        en: Activity title
      type: MLTEXT
      computed:
        type: SCRIPT
        config:
          fn: |
            // "!" gives an empty string instead of null, presuf wraps only a non-empty value
            function presuf(text, prefix, suffix) {
              return text ? (prefix || "") + text + (suffix || "") : "";
            }

            const typeRu = value.load("_type._disp.closest.ru!");
            const typeEn = value.load("_type._disp.closest.en!");

            const topic = value.load("topic!").trim();
            const suffixRu = topic || value.load("_parent._disp.closest.ru!").trim();
            const suffixEn = topic || value.load("_parent._disp.closest.en!").trim();

            return {
              ru: typeRu + presuf(suffixRu, ": "),
              en: typeEn + presuf(suffixEn, ": ")
            };
