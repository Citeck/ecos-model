---
id: recording-aspect
name:
  ru: Запись звонка/встречи
  en: Call/Meeting Recording
attributes:
  - id: recording
    name:
      ru: Аудиозапись
      en: Audio Recording
    type: CONTENT
  - id: transcription
    name:
      ru: Расшифровка
      en: Transcription
    type: TEXT
  - id: transcriptionDiarized
    name:
      ru: Расшифровка по спикерам
      en: Diarized Transcription
    type: TEXT
  - id: summary
    name:
      ru: Резюме встречи
      en: Meeting Summary
    type: TEXT
  - id: recordingDuration
    name:
      ru: Длительность записи (сек)
      en: Recording Duration (sec)
    type: NUMBER
  - id: recordingStatus
    name:
      ru: Статус записи
      en: Recording Status
    type: OPTIONS
    config:
      values:
        - value: downloading
          label:
            ru: Загружается
            en: Downloading
        - value: downloaded
          label:
            ru: Аудио сохранено
            en: Audio saved
        - value: processing
          label:
            ru: Обрабатывается
            en: Processing
        - value: completed
          label:
            ru: Обработана
            en: Completed
        - value: download-failed
          label:
            ru: Ошибка загрузки
            en: Download failed
        - value: transcription-failed
          label:
            ru: Ошибка расшифровки
            en: Transcription failed
  - id: callPlatform
    name:
      ru: Платформа звонка
      en: Call Platform
    type: TEXT
  - id: meetingUrl
    name:
      ru: Ссылка на встречу
      en: Meeting URL
    type: TEXT
